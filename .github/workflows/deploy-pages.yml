name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Version static asset URLs
        run: |
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA}\"|" index.html
          sed -i "s|src=\"star-messages.js\"|src=\"star-messages.js?v=${GITHUB_SHA}\"|" index.html
          sed -i "s|src=\"assets/\\([^\"]*\\)\"|src=\"assets/\\1?v=${GITHUB_SHA}\"|g" index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
